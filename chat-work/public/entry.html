<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Ziad Alkfory</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#080808;color:#fff;
  font-family:Arial,sans-serif
}
.box{
  width:100%;max-width:390px;text-align:center;padding:32px 22px;
  border:1px solid #501414;border-radius:20px;
  background:linear-gradient(145deg,#151515,#090909);
  box-shadow:0 0 30px #7c101022

.logo{

  border-radius:50%;display:grid;place-items:center;font-size:32px;
  font-weight:bold;color:#fff;text-shadow:0 0 15px #e11;

h1{font-size:24px;margin:8px 0;color:#fff}
p{color:#aaa;font-size:14px;line-height:1.8}
button{
  width:100%;padding:14px;margin-top:12px;border:1px solid #a71919;
  border-radius:10px;background:#170b0b;color:#fff;font-size:16px;
  cursor:pointer

button:hover{background:#351010}
input{
  width:100%;padding:13px;margin-top:14px;border-radius:9px;
  border:1px solid #444;background:#111;color:white;font-size:17px;
  text-align:center
}
.hidden{display:none}
.error{color:#ff6868;min-height:22px}

<style id="alkfory-entry-glow">
/* شعار جديد واسم المطور */
.logo {
  width: 130px !important;
  height: 130px !important;
  border: 2px solid #ff1738 !important;
  border-radius: 50% !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  margin: 0 auto 12px !important;
  font-size: 58px !important;
  color: #ff233f !important;
  background: radial-gradient(circle, #26070c, #050505 72%) !important;
  text-shadow: 0 0 15px #ff1738;
  animation: logoPulse 2.4s ease-in-out infinite;
}
.brand-name {
  text-align: center;
  margin: 8px 0 22px;
  font-weight: 800;
  font-size: clamp(24px, 6vw, 32px);
  letter-spacing: 1px;
  color: #f5f5f5;
  text-shadow: 0 0 10px #ff173855;
}
.brand-name span { color: #ff233f; }

/* مربعات الاختيار: تنور وتطفي */
button, .choice, .option, a.choice, .entry-btn {
  animation: choiceGlow 2.2s ease-in-out infinite !important;
  transition: box-shadow .3s, border-color .3s, background .3s;
}

  animation-delay: 1.1s !important;
}
@keyframes logoPulse {
  0%, 100% { box-shadow: 0 0 8px #ff173833; }
  50% { box-shadow: 0 0 25px #ff1738aa, inset 0 0 16px #ff173822; }
}
@keyframes choiceGlow {
  0%, 100% {
    border-color: #65121f;
    box-shadow: 0 0 3px #ff173822;
  }
  50% {
    border-color: #ff233f;
    box-shadow: 0 0 18px #ff173866, inset 0 0 12px #ff17381c;
  }
}
@media (prefers-reduced-motion: reduce) {
  .logo, button, .choice, .option, a.choice, .entry-btn {
    animation: none !important;
  }

</style>


<!-- ALKFORY_PWA_INSTALL_V1 -->
<meta name="theme-color" content="#080808">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/alkfory.svg" type="image/svg+xml">

</head>
<body>
<main class="box">
  <div class="logo">👑</div>
<div class="brand-name">Ziad <span>Alkfory</span></div>
  <div class="online">● Ziad Alkfory</div>
  <h1>مرحبًا بك</h1>
  <p>اختر طريقة الدخول إلى الموقع</p>

  <section id="choices">
    <button onclick="visitor()">👤 زائر عادي</button>
    <button onclick="showDeveloper()">⚜️ مطور</button>
  
    <button id="alkforyInstallBtn" type="button"
      style="width:100%;margin-top:12px;background:#171017;border:1px solid #b52b45;color:#fff">
      📲 تنزيل تطبيق ALKFORY
    </button>

    <button id="alkforyUpdateBtn" type="button"
      style="width:100%;margin-top:10px;background:#25151a;border:1px solid #d12b48;color:#fff;padding:12px;border-radius:10px">
      🔄 تحديث التطبيق
    </button>
    <p id="alkforyUpdateHint" style="font-size:13px;color:#aaa;line-height:1.7"></p>
    <p id="alkforyInstallHint" style="font-size:13px;color:#aaa;line-height:1.7"></p>

  </section>

  <section id="developer" class="hidden">
    <p>أدخل رمز المطور للمتابعة</p>
    <form id="loginForm">
      <input id="code" type="password" inputmode="numeric"
        autocomplete="current-password" placeholder="رمز المطور" required>
      <button type="submit">دخول لوحة المطور</button>
    </form>
    <p class="error" id="error"></p>
    <button onclick="back()">رجوع</button>
  </section>
</main>

<script>
async function visitor(){
  try {
    const r = await fetch('/api/visitor-login', { method: 'POST' });
    const data = await r.json();
    if (data.success) location.href = '/home.html';
    else alert('تعذر الدخول، حاول مرة أخرى.');
  } catch {
    alert('تعذر الاتصال بالسيرفر.');
  }
}
function showDeveloper(){
  document.getElementById('choices').classList.add('hidden');
  document.getElementById('developer').classList.remove('hidden');
}
function back(){
  document.getElementById('developer').classList.add('hidden');
  document.getElementById('choices').classList.remove('hidden');
}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const error=document.getElementById('error');
  error.textContent='';
  try{
    const r=await fetch('/api/developer-login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:document.getElementById('code').value})
    });
    const data=await r.json();
    if(data.success){
      location.href='/admin';
    }else{
      error.textContent='الرمز غير صحيح';
    }
  }catch{
    error.textContent='تعذر الاتصال بالسيرفر';
  }
});
</script>

<script>
/* ALKFORY_PWA_INSTALL_V1 */
(() => {
  let installPrompt = null;
  const btn = document.getElementById('alkforyInstallBtn');
  const hint = document.getElementById('alkforyInstallHint');
  if (!btn || !hint) return;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  const isInstalled = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  if (isInstalled()) {
    btn.textContent = '✅ تطبيق ALKFORY مثبت بالفعل';
    hint.textContent = 'يمكنك فتح ALKFORY من الشاشة الرئيسية.';
    btn.disabled = true;
  }

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
    btn.textContent = '📲 تثبيت تطبيق ALKFORY';
  });

  btn.addEventListener('click', async () => {
    if (isInstalled()) {
      hint.textContent = 'التطبيق مثبت بالفعل على جهازك.';
      return;
    }

    if (installPrompt) {
      installPrompt.prompt();
      const result = await installPrompt.userChoice;
      installPrompt = null;
      hint.textContent = result.outcome === 'accepted'
        ? 'بدأ تثبيت التطبيق.'
        : 'يمكنك التثبيت في أي وقت من جديد.';
      return;
    }

    hint.textContent =
      'لتثبيت ALKFORY: افتح الموقع من Chrome، ثم قائمة ⋮ واختر "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية". يلزم فتح الموقع عبر HTTPS أو localhost.';
  });

  window.addEventListener('appinstalled', () => {
    btn.textContent = '✅ تم تثبيت ALKFORY';
    hint.textContent = 'يمكنك فتح التطبيق من الشاشة الرئيسية.';
    installPrompt = null;
  });
})();
</script>


<script>
/* ALKFORY_OFFLINE_NOTICE */
(() => {
  let box;
  function showOffline() {
    if (!box) {
      box = document.createElement('div');
      box.id = 'alkfory-offline-notice';
      box.style.cssText = `
        position:fixed;z-index:999999;top:15px;left:5%;width:90%;
        box-sizing:border-box;padding:16px;border-radius:14px;
        background:#641b25;color:white;text-align:center;
        font: bold 15px Arial;box-shadow:0 5px 20px #0005;
      `;
      document.body.appendChild(box);
    }
    box.textContent = '⚠️ لا يوجد اتصال بالإنترنت أو أن السيرفر غير متاح. تأكد من الاتصال وحاول مرة أخرى.';
    box.style.display = 'block';
  }
  function hideOffline() {
    if (box) box.style.display = 'none';
  }
  window.addEventListener('offline', showOffline);
  window.addEventListener('online', hideOffline);

  const originalFetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    try {
      const response = await originalFetch(...args);
      if (response.ok) hideOffline();
      return response;
    } catch (error) {
      showOffline();
      throw error;
    }
  };

  if (!navigator.onLine) showOffline();
})();
</script>


<script>
/* ALKFORY_APP_UPDATE_V2 */
(() => {
  const btn = document.getElementById('alkforyUpdateBtn');
  const hint = document.getElementById('alkforyUpdateHint');
  if (!btn || !hint || !('serviceWorker' in navigator)) return;

  let refreshing = false;

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    hint.textContent = '✅ تم تفعيل التحديث، جاري فتح النسخة الجديدة...';
    location.reload();
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    hint.textContent = '⏳ جاري فحص وتحميل آخر تحديث...';

    try {
      let reg = await navigator.serviceWorker.getRegistration('/');

      if (!reg) {
        reg = await navigator.serviceWorker.register('/sw.js');
      }

      await reg.update();

      if (reg.waiting) {
        hint.textContent = '✅ تم العثور على تحديث، جاري التفعيل...';
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        return;
      }

      if (reg.installing) {
        hint.textContent = '⏳ يتم تثبيت التحديث...';
        reg.installing.addEventListener('statechange', () => {
          if (reg.installing && reg.installing.state === 'installed') {
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          }
        });
        return;
      }

      hint.textContent = '✅ التطبيق يستخدم أحدث نسخة منشورة.';
    } catch (error) {
      console.error('ALKFORY update error:', error);
      hint.textContent = '⚠️ فشل التحديث. تحقق من الإنترنت وحاول مجددًا.';
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>






<style>
#alkfory-welcome {
 position:fixed;z-index:999999;bottom:22px;left:16px;right:16px;
 background:#171717;color:white;border:1px solid #a90030;
 border-radius:18px;padding:18px;text-align:center;
 box-shadow:0 0 22px #a9003055;font-size:17px;
}
#alkfory-welcome button {
 background:#a90030;color:white;border:0;border-radius:10px;
 padding:10px 20px;margin:10px 5px;font-weight:bold;
}
</style>

<div id="alkfory-welcome" hidden>
 <div style="font-size:30px;color:#ff233f;font-weight:bold">Z</div>
 <div>⚜️ أهلاً بيك في موقع ALKFORY ⚜️</div>
 <div>نورت الموقع، نتمنى لك تجربة ممتعة ❤️</div>
 <button id="alkfory-start">تفعيل الإشعار والصوت</button>
 <button id="alkfory-close">إغلاق</button>
</div>

<script>
(() => {
 const box = document.getElementById('alkfory-welcome');
 const start = document.getElementById('alkfory-start');
 const close = document.getElementById('alkfory-close');
 if (!box || !start || !close) return;

 const seenKey = 'alkfory_welcome_seen_v2';
 const noticeKey = 'alkfory_notice_shown_v2';

 const firstAudio = new Audio('/audio/entry-1.mp3');
 firstAudio.preload = 'auto';

 let audioStarted = false;

 async function playEntryAudio() {
   if (audioStarted) return;
   audioStarted = true;
   try {
     await firstAudio.play();
     await new Promise(resolve => {
       firstAudio.addEventListener('ended', resolve, { once: true });
       firstAudio.addEventListener('error', resolve, { once: true });
     });
   } catch (e) {
     audioStarted = false;
     console.log('تعذر تشغيل تسجيلات الترحيب:', e);
   }
 }

 if (!localStorage.getItem(seenKey)) {
   box.hidden = false;
 } else {
   playEntryAudio();
 }

 close.addEventListener('click', () => {
   box.hidden = true;
 });

 async function handleNotification() {
   if (!('Notification' in window)) return;
   if (Notification.permission === 'default') {
     try {
       await Notification.requestPermission();
     } catch (e) {
       console.log('Notification permission unavailable:', e);
     }
   }

   if (Notification.permission !== 'granted') return;
   if (sessionStorage.getItem(noticeKey)) return;

   const options = {
     body: 'أهلاً بيك! نورت موقع ALKFORY ❤️',
     icon: '/icons/z-notification.svg',
     badge: '/icons/z-notification.svg',
     tag: 'alkfory-visitor-welcome',
     renotify: false
   };

   try {
     if ('serviceWorker' in navigator) {
       const reg = await navigator.serviceWorker.ready;
       await reg.showNotification('Z | ALKFORY', options);
     } else {
       new Notification('Z | ALKFORY', options);
     }
     sessionStorage.setItem(noticeKey, '1');
   } catch (e) {
     console.log('Notification unavailable:', e);
   }
 }

 start.addEventListener('click', async () => {
   localStorage.setItem(seenKey, '1');
   box.hidden = true;
   await playEntryAudio();
   await handleNotification();
 });
})();
</script>
