<textarea id="text" placeholder="" maxlength="4000" rows="1" aria-label="اكتب رسالتك"></textarea>

<script>
const box=document.getElementById('messages');
const form=document.getElementById('form');
const input=document.getElementById('text');
const statusBox=document.getElementById('status');
const historyKey='alkfory_ai_history_v1';
let history=[];
try{history=JSON.parse(localStorage.getItem(historyKey)||'[]')}catch(e){history=[]}
function save(){localStorage.setItem(historyKey,JSON.stringify(history.slice(-80)))}

function draw(){
 box.innerHTML='';
 for(const m of history){
  const el=document.createElement('div');
  el.className='msg '+(m.role==='user'?'user':'ai');
  el.textContent=m.text;
  box.appendChild(el);

  if(m.role==='assistant'){
   const actions=document.createElement('div');
   actions.className='ai-actions';

   const copy=document.createElement('button');
   copy.type='button';copy.textContent='📋';
   copy.addEventListener('click',async()=>{
    try{
     await navigator.clipboard.writeText(m.text);
     statusBox.textContent='تم نسخ الرد';
    }catch(e){statusBox.textContent='تعذر النسخ من المتصفح';}
   });

   const react=document.createElement('button');
   react.type='button';react.textContent=m.reaction?'❤️':'👍';
   react.textContent=typeof m.reaction==='string'?m.reaction:(m.reaction?'❤️':'👍');
   const picker=document.createElement('div');
   picker.className='alk-reaction-picker';
   picker.hidden=true;
   const thanks=document.createElement('span');
   thanks.className='alk-reaction-thanks';
   thanks.textContent=m.reaction?'شكرًا لتفاعلك':'';
   const reactions=['❤️','😂','😮','😢','😡','👍'];
   for(const emoji of reactions){
    const choice=document.createElement('button');
    choice.type='button';
    choice.textContent=emoji;
    choice.setAttribute('aria-label','تفاعل '+emoji);
    choice.addEventListener('click',()=>{
     m.reaction=emoji;
     react.textContent=emoji;
     thanks.textContent=document.documentElement.lang==='en'?'Thanks for reacting':'شكرًا لتفاعلك';
     picker.hidden=true;
     save();
    });
    picker.appendChild(choice);
   }
   let pressTimer=null;
   let longPressed=false;
   react.addEventListener('pointerdown',()=>{
    longPressed=false;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{
     longPressed=true;
     picker.hidden=false;
    },500);
   });
   ['pointerup','pointerleave','pointercancel'].forEach(eventName=>{
    react.addEventListener(eventName,()=>clearTimeout(pressTimer));
   });
   react.addEventListener('contextmenu',e=>e.preventDefault());
   react.addEventListener('click',()=>{
    if(longPressed){longPressed=false;return;}
    m.reaction=m.reaction?'':'👍';
    react.textContent=m.reaction||'👍';
    thanks.textContent=m.reaction?(document.documentElement.lang==='en'?'Thanks for reacting':'شكرًا لتفاعلك'):'';
    save();
   });

   const voice=document.createElement('button');
   voice.type='button';voice.textContent='🔊';
   voice.addEventListener('click',()=>{
    if(!('speechSynthesis' in window)){
     statusBox.textContent='الصوت غير مدعوم في هذا المتصفح';return;
    }

    const english=document.documentElement.lang==='en';
    let spokenText=String(m.text||'');
    if(!english){
      spokenText=spokenText
        .replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\uFE0F\u200D]/gu,' ')
        .replace(/[A-Za-z][A-Za-z0-9._-]*/g,' ')
        .replace(/\s+/g,' ').trim();
    }else{
      spokenText=spokenText
        .replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\uFE0F\u200D]/gu,' ')
        .replace(/\s+/g,' ').trim();
    }
    if(!spokenText)return;
    speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(spokenText);
    utterance.lang=english?'en-US':'ar-EG';
    utterance.rate=0.96;
    utterance.pitch=1.08;
    const voices=speechSynthesis.getVoices();
    const matching=voices.filter(v=>english?/^en/i.test(v.lang):/^ar/i.test(v.lang));
    const preferred=matching.find(v=>/female|woman|hoda|salma|amira|laila|layla/i.test(v.name));
    if(preferred)utterance.voice=preferred;
    speechSynthesis.speak(utterance);
   });

   const share=document.createElement('button');
   share.type='button';share.textContent='↗️';
   share.addEventListener('click',async()=>{
    try{
     if(navigator.share){
      await navigator.share({title:'ALKFORY AI',text:m.text});
     }else{
      await navigator.clipboard.writeText(m.text);
      statusBox.textContent='تم نسخ الرد للمشاركة';
     }
    }catch(e){
     if(e.name!=='AbortError')statusBox.textContent='تعذرت المشاركة';
    }
   });

   actions.append(copy,react,voice,share,picker,thanks);
   el.appendChild(actions);
  }
 }
 box.scrollTop=box.scrollHeight;
}
draw();


const alkMenu=document.getElementById('alkMenu');
document.getElementById('menuOpen').addEventListener('click',()=>alkMenu.hidden=false);
document.getElementById('menuClose').addEventListener('click',()=>alkMenu.hidden=true);

function applyAlkTheme(){
 const dark=localStorage.getItem('alkfory_theme')!=='light';
 document.body.classList.toggle('alk-theme-light',!dark);

form.addEventListener('submit',async e=>{
 e.preventDefault();
 const message=input.value.trim();
 const imageFile=document.getElementById('image').files[0];
 if(!message && !imageFile)return;
 if(imageFile && imageFile.size > 4 * 1024 * 1024){
  statusBox.textContent='حجم الصورة أكبر من الحد المسموح (4 ميجابايت).';
  return;
 }
 let image=null;
 if(imageFile){
  image=await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve({
    mimeType:imageFile.type,
    data:String(reader.result).split(',')[1]
   });
   reader.onerror=reject;
   reader.readAsDataURL(imageFile);
  });
 }
 history.push({role:'user',text:message || 'أرسلت صورة', image:!!image});
 save();draw();input.value='';document.getElementById('image').value='';
 statusBox.innerHTML='<span class="alk-ai-spinner" role="status" aria-label="جاري الرد"><span>⟳</span><span>⟳</span></span>';
 document.getElementById('send').disabled=true;
 try{
  const context=history.slice(-12).map(m=>(m.role==='user'?'المستخدم: ':'المساعد: ')+m.text).join('\n');
  const response=await fetch('/api/ai',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    message:(message || 'حلّل الصورة وأجب عن السؤال الموجود فيها.')+
      '\nتابع سياق المحادثة التالية وأجب عن آخر رسالة فقط:\n'+context,
    image
   })
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'تعذر الحصول على الرد');
  history.push({role:'assistant',text:data.answer||'لم يصل رد.'});
  save();draw();statusBox.textContent='جاهز';
 }catch(err){
  statusBox.textContent=err.message||'حدث خطأ في الاتصال';
 }
 document.getElementById('send').disabled=false;
 input.focus();
});
</script>

<script>
(() => {
  const button = document.getElementById('alkInstallBtn');
  if (!button) return;

  const standalone = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  function updateInstallButton() {
    const area = document.getElementById('alkInstallArea');
    if (standalone()) {
      area.hidden = true;
      button.hidden = true;
    }
  }

  updateInstallButton();
  window.addEventListener('appinstalled', () => {
    button.hidden = true;
    document.getElementById('alkInstallArea').hidden = true;
  });

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    if (standalone()) return;
    window.alkInstallPrompt = event;
    button.hidden = false;
  });

  button.addEventListener('click', async () => {
    const promptEvent = window.alkInstallPrompt;
    if (!promptEvent) return;
    promptEvent.prompt();
    await promptEvent.userChoice;
    window.alkInstallPrompt = null;
    button.hidden = true;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
})();
</script>

<script>
(function(){
  if(window.alkforyVoiceChat) return;
  window.alkforyVoiceChat = true;

  const mic = document.getElementById('alkMicButton') ||
              document.getElementById('mic');
  if(!mic) return;

  const Recognition = window.SpeechRecognition ||
                      window.webkitSpeechRecognition;
  let listening = false;
  let recognition = null;

  mic.title = 'محادثة صوتية: اضغط للتحدث';
  mic.setAttribute('aria-label','بدء المحادثة الصوتية');

  mic.addEventListener('click', function(){
    if(!Recognition){
      const box = document.getElementById('status') ||
                  document.getElementById('statusBox');
      if(box) box.textContent =
        'التعرف الصوتي غير مدعوم في هذا المتصفح.';
      return;
    }

    if(listening){
      try { recognition.stop(); } catch(e) {}
      listening = false;
      mic.classList.remove('voice-listening');
      return;
    }

    recognition = new Recognition();
    recognition.lang =
      document.documentElement.lang === 'en' ? 'en-US' : 'ar-EG';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function(){
      listening = true;
      mic.classList.add('voice-listening');
      mic.title = 'استمع الآن... اضغط للإيقاف';
    };

    recognition.onresult = function(event){
      const spoken = event.results[0][0].transcript.trim();
      const input = document.getElementById('message') ||
                    document.querySelector('textarea');
      if(!input || !spoken) return;
      input.value = spoken;
      input.dispatchEvent(new Event('input',{bubbles:true}));
      const form = document.getElementById('form') ||
                   input.closest('form');
      if(form) form.requestSubmit();
    };

    recognition.onerror = function(){
      const box = document.getElementById('status') ||
                  document.getElementById('statusBox');
      if(box) box.textContent = 'تعذر التقاط الصوت؛ حاول مرة أخرى.';
    };

    recognition.onend = function(){
      listening = false;
      mic.classList.remove('voice-listening');
      mic.title = 'محادثة صوتية: اضغط للتحدث';
    };

    try { recognition.start(); }
    catch(e) { listening = false; }
  });
})();
</script>

<script>
(function(){
 if(window.__alkforyVoiceScreenV2)return;
 window.__alkforyVoiceScreenV2=true;

 const screen=document.getElementById('alkforyVoiceScreen');
 const call=document.getElementById('alkCallButton');
 const orb=document.getElementById('alkVoiceOrb');
 const caption=document.getElementById('alkVoiceCaption');
 const photo=document.getElementById('alkVoicePhoto');
 const cancel=document.getElementById('alkVoiceCancel');
 const pause=document.getElementById('alkVoicePause');
 const close=document.getElementById('alkVoiceClose');
 const input=document.getElementById('message') ||
              document.querySelector('#form textarea');
 const form=document.getElementById('form') ||
             (input && input.closest('form'));
 const Recognition=window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!screen || !call || !input || !form)return;

 // البحث عن صورة الحساب في عناصر الموقع
 const profile=document.querySelector(
  '#profileImage,#profile-image,#avatar,.profile img,.profile-image,img.avatar'
 );
 if(profile && profile.src)photo.src=profile.src;
 else photo.style.display='none';

 let active=false,paused=false,recognition=null,lastReply='',observer=null;

 function status(t){caption.textContent=t}
 function stopRecognition(){
  if(recognition){try{recognition.stop()}catch(e){} recognition=null}
 }
 function stopAll(){
  active=false;paused=false;stopRecognition();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(observer)observer.disconnect();
  observer=null;orb.className='';pause.textContent='Ⅱ';
  pause.classList.remove('paused');
 }
 function closeScreen(){
  stopAll();screen.classList.remove('open');
 }
 function speak(text){
  if(!active || paused || !text || !('speechSynthesis' in window))return;
  text=String(text)
   .replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,' ')
   .replace(/\s+/g,' ').trim();
  if(!text)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const en=document.documentElement.lang==='en';
  u.lang=en?'en-US':'ar-EG';u.rate=.96;u.pitch=1.12;
  const voices=speechSynthesis.getVoices();
  const matching=voices.filter(v=>en?/^en/i.test(v.lang):/^ar/i.test(v.lang));
  const female=matching.find(v=>/female|woman|hoda|salma|amira|laila|layla|zira/i.test(v.name));
  if(female)u.voice=female;
  u.onstart=()=>{orb.className='speaking';status('ALKFORY AI بيتكلم...')};
  u.onend=()=>{orb.className='';if(active&&!paused)status('اضغط زر التحدث للمتابعة')};
  u.onerror=()=>{orb.className='';status('تعذر تشغيل الصوت على هذا الجهاز')};
  speechSynthesis.speak(u);
 }

 function findLatestReply(){
  const selectors=[
   '.message.assistant','.assistant-message',
   '[data-role="assistant"]','.ai-message',
   '.message.bot','.bot-message'
  ];
  let nodes=[];
  selectors.forEach(sel=>document.querySelectorAll(sel).forEach(n=>nodes.push(n)));
  nodes=[...new Set(nodes)];
  for(let i=nodes.length-1;i>=0;i--){
   const t=(nodes[i].innerText||'').trim();
   if(t && t!==lastReply){
    lastReply=t;
    return t;
   }
  }
  return '';
 }

 function watchReply(){
  if(observer)observer.disconnect();
  observer=new MutationObserver(()=>{
   if(!active||paused)return;
   const reply=findLatestReply();
   if(reply){
    observer.disconnect();observer=null;
    speak(reply);
   }
  });
  observer.observe(document.body,{subtree:true,childList:true,characterData:true});
  setTimeout(()=>{
   if(observer){
    observer.disconnect();observer=null;
    if(active&&!paused)status('الرد لم يظهر بعد؛ حاول مرة أخرى');
   }
  },90000);
 }

 function listen(){
  if(!active||paused)return;
  if(!Recognition){status('التعرف على الصوت غير مدعوم في المتصفح');return}
  recognition=new Recognition();
  recognition.lang=document.documentElement.lang==='en'?'en-US':'ar-EG';
  recognition.continuous=false;recognition.interimResults=false;
  recognition.onstart=()=>{orb.className='listening';status('أنا بسمعك... اتكلم')};
  recognition.onresult=e=>{
   const words=e.results[0][0].transcript.trim();
   if(!words)return;
   input.value=words;
   input.dispatchEvent(new Event('input',{bubbles:true}));
   status('جاري إرسال كلامك...');
   watchReply();
   form.requestSubmit();
  };
  recognition.onerror=()=>status('تعذر التقاط الصوت؛ اضغط للتحدث مرة أخرى');
  recognition.onend=()=>{if(active&&!paused){orb.className='';if(!observer)status('اضغط زر التحدث للمتابعة')}};
  try{recognition.start()}catch(e){status('تعذر بدء الميكروفون')}
 }

 function openScreen(){
  stopAll();active=true;screen.classList.add('open');
  status('اضغط زر التحدث وابدأ كلامك');
  listen();
 }

 call.addEventListener('click',e=>{e.preventDefault();openScreen()});
 cancel.addEventListener('click',closeScreen);
 close.addEventListener('click',closeScreen);

 pause.addEventListener('click',()=>{
  if(!active)return;
  paused=!paused;
  if(paused){
   stopRecognition();
   if('speechSynthesis' in window)speechSynthesis.pause();
   pause.textContent='▶';pause.classList.add('paused');
   status('المحادثة متوقفة مؤقتًا');
  }else{
   pause.textContent='Ⅱ';pause.classList.remove('paused');
   if('speechSynthesis' in window && speechSynthesis.paused){
    speechSynthesis.resume();status('استكمال صوت الرد...');
   }else{
    status('اضغط زر التحدث للمتابعة');listen();
   }
  }
 });
})();
</script>

<script>
(() => {
  if (window.__ALKFORY_VOICE_COMPLETE_FIX) return;
  window.__ALKFORY_VOICE_COMPLETE_FIX = true;

  const $ = s => document.querySelector(s);
  const screen = $('#alkforyVoiceScreen');
  const call = $('#alkCallButton');
  const photo = $('#alkVoicePhoto');
  const caption = $('#alkVoiceCaption');
  const cancel = $('#alkVoiceCancel');
  const pause = $('#alkVoicePause');
  const close = $('#alkVoiceClose');

  const input = $('#text') || $('#message') || $('#form textarea') ||
                $('#form input[type="text"]');
  const form = $('#form') || (input && input.closest('form'));

  const profile = $('header img[alt="صورة المطور"]') ||
                  $('header img[src*="alkfory-profile"]') ||
                  $('img[src*="alkfory-profile"]');

  if (profile && photo) {
    photo.src = profile.currentSrc || profile.src;
    photo.style.display = 'block';
    photo.onerror = () => {
      photo.src = '/alkfory-profile.jpg';
      photo.style.display = 'block';
    };
  }

  function setCaption(text) {
    if (caption) caption.textContent = text;
  }

  function speak(text, done) {
    if (!('speechSynthesis' in window) || !text) {
      if (done) done();
      return;
    }
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-EG';
    utterance.rate = 0.94;
    utterance.pitch = 1.12;

    const voices = speechSynthesis.getVoices();
    const female = voices.find(v =>
      /ar/i.test(v.lang) && /female|hoda|salma|amira|laila|layla/i.test(v.name)
    );
    const arabic = voices.find(v => /ar/i.test(v.lang));
    if (female || arabic) utterance.voice = female || arabic;

    utterance.onend = () => done && done();
    utterance.onerror = () => done && done();
    speechSynthesis.speak(utterance);
  }

  const Recognition = window.SpeechRecognition ||
                      window.webkitSpeechRecognition;
  let recognition = null;
  let active = false;
  let paused = false;
  let waitingReply = false;
  let lastReply = '';
  let observer = null;

  function findReply() {
    const nodes = document.querySelectorAll(
      '.message.assistant,.assistant-message,[data-role="assistant"],' +
      '.ai-message,.message.bot,.bot-message'
    );
    for (let i = nodes.length - 1; i >= 0; i--) {
      const t = (nodes[i].innerText || nodes[i].textContent || '').trim();
      if (t && t !== lastReply && t.length > 2) return t;
    }
    return '';
  }

  function startListening() {
    if (!active || paused || waitingReply || !recognition) return;
    try {
      recognition.start();
      setCaption('سامعك… اتكلم دلوقتي');
    } catch (e) {}
  }

  function stopListening() {
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }
  }

  function startObserver() {
    if (observer) observer.disconnect();

    observer = new MutationObserver(() => {
      if (!active || !waitingReply) return;
      const reply = findReply();
      if (!reply) return;

      lastReply = reply;
      waitingReply = false;
      observer.disconnect();

      speak(reply, () => {
        if (active && !paused) {
          setCaption('اتفضل، سامعك تاني');
          setTimeout(startListening, 500);
        }
      });
    });

    observer.observe(document.body, {
      childList:true, subtree:true, characterData:true
    });

    setTimeout(() => {
      if (waitingReply) {
        const reply = findReply();
        if (reply) {
          lastReply = reply;
          waitingReply = false;
          observer.disconnect();
          speak(reply, () => {
            if (active && !paused) startListening();
          });
        }
      }
    }, 1800);
  }

  function submitSpeech(text) {
    if (!input || !form) {
      setCaption('مش قادر أوصل لمربع الكتابة');
      return;
    }
    input.value = text;
    input.dispatchEvent(new Event('input', {bubbles:true}));
    waitingReply = true;
    startObserver();
    stopListening();
    setCaption('ثواني، بفكر في الرد…');
    if (form.requestSubmit) form.requestSubmit();
    else form.dispatchEvent(new Event('submit', {bubbles:true,cancelable:true}));
  }

  if (Recognition) {
    recognition = new Recognition();
    recognition.lang = 'ar-EG';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = event => {
      const text = event.results?.[0]?.[0]?.transcript?.trim();
      if (text) submitSpeech(text);
    };
    recognition.onerror = event => {
      if (active) setCaption('مشكلة في الميكروفون: ' + event.error);
    };
    recognition.onend = () => {
      if (active && !paused && !waitingReply) {
        setTimeout(startListening, 500);
      }
    };
  }

  async function openVoice() {
    if (!screen) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('افتح الموقع من Chrome عبر اتصال آمن HTTPS حتى يعمل الميكروفون.');
      return;
    }

    try {
      setCaption('اسمح باستخدام الميكروفون لبدء المحادثة');

      // طلب الإذن يظهر بعد ضغط المستخدم على زر الدردشة
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(track => track.stop());

      active = true;
      paused = false;
      waitingReply = false;
      screen.classList.add('alk-voice-active');
      screen.style.setProperty('display','flex','important');

      if (profile && photo) {
        photo.src = profile.currentSrc || profile.src;
        photo.style.display = 'block';
      }

      if (!Recognition) {
        setCaption('المتصفح لا يدعم الاستماع الصوتي. استخدم Chrome.');
        speak('الميكروفون اتفعل، لكن المتصفح لا يدعم الاستماع الصوتي.');
        return;
      }

      setCaption('أهلًا بيك، أنا سامعاك. اتكلم براحتك.');
      speak('أهلًا بيك! أنا معاك، قولّي محتاج إيه؟', () => {
        if (active && !paused) startListening();
      });

    } catch (err) {
      active = false;
      setCaption(
        err.name === 'NotAllowedError'
          ? 'إذن الميكروفون مرفوض. اسمح به من نافذة المتصفح.'
          : 'تعذر تشغيل الميكروفون: ' + err.name
      );
    }
  }

  function closeVoice() {
    active = false;
    paused = false;
    waitingReply = false;
    stopListening();
    if (observer) observer.disconnect();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (screen) {
      screen.classList.remove('alk-voice-active');
      screen.style.setProperty('display','none','important');
    }
  }

  function togglePause() {
    if (!active) return;
    paused = !paused;
    if (paused) {
      stopListening();
      if ('speechSynthesis' in window) speechSynthesis.pause();
      setCaption('المحادثة متوقفة مؤقتًا');
      if (pause) pause.textContent = 'استئناف';
    } else {
      if ('speechSynthesis' in window) speechSynthesis.resume();
      if (pause) pause.textContent = 'إيقاف مؤقت';
      setCaption('رجعنا، اتكلم');
      startListening();
    }
  }

  if (call) call.addEventListener('click', e => {
    e.preventDefault();
    e.stopImmediatePropagation();
    openVoice();
  }, true);

  if (cancel) cancel.addEventListener('click', closeVoice);
  if (close) close.addEventListener('click', closeVoice);
  if (pause) pause.addEventListener('click', togglePause);

  // ترحيب يظهر داخل المحادثة عند فتح الصفحة
  function addWelcome() {
    const box = $('#messages') || $('.messages') ||
                $('#chatMessages') || $('#chat-messages');
    if (!box || box.querySelector('.alkfory-auto-welcome')) return;

    const welcome = document.createElement('div');
    welcome.className = 'alkfory-auto-welcome';
    welcome.textContent = 'إزيك! أنا معاك، قولّي محتاج إيه؟';
    welcome.style.cssText =
      'margin:12px auto;padding:12px 16px;max-width:88%;' +
      'background:#171717;color:#fff;border:1px solid #8d0019;' +
      'border-radius:16px;text-align:right;direction:rtl;';
    box.appendChild(welcome);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addWelcome, {once:true});
  } else {
    addWelcome();
  }
})();
</script>

<script id="ALKFORY-MAIN-MENU-SEARCH-V2-SCRIPT">
(() => {
  const input = document.getElementById('alkfory-main-search');
  const results = document.getElementById('alkfory-main-search-results');
  const menu = document.getElementById('alkMenu');
  if (!input || !results || input.dataset.ready) return;
  input.dataset.ready = '1';

  const searchable = 'h1,h2,h3,h4,p,button,a,label,li';
  input.addEventListener('input', () => {
    const q = input.value.trim().toLocaleLowerCase('ar');
    results.replaceChildren();
    if (!q) return;

    const found = [...document.querySelectorAll(searchable)]
      .filter(el =>
        !el.closest('#alkMenu') &&
        !el.closest('script,style') &&
        el.getClientRects().length &&
        (el.innerText || el.textContent || '').trim()
          .toLocaleLowerCase('ar').includes(q)
      )
      .slice(0, 12);

    if (!found.length) {
      const msg = document.createElement('div');
      msg.textContent = 'لا توجد نتائج مطابقة.';
      msg.style.cssText = 'color:#ccc;padding:10px;text-align:center';
      results.appendChild(msg);
      return;
    }

    found.forEach(el => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = (el.innerText || el.textContent).trim()
        .replace(/\s+/g, ' ').slice(0, 100);
      btn.addEventListener('click', () => {
        if (menu) menu.hidden = true;
        el.scrollIntoView({behavior:'smooth', block:'center'});
      });
