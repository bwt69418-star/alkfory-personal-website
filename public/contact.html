<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Ziad Alkfory</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242424}
.brand{color:#ef3349;font-weight:bold}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}
button,.card{border:1px solid #342126;background:#111;color:#fff;border-radius:14px}
button{padding:10px 16px}
main{max-width:520px;margin:35px auto;padding:20px}
h1{text-align:center;font-size:28px}
.desc{text-align:center;color:#aaa;margin-bottom:28px}
.card{padding:18px;margin:13px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:.2s}
.card:hover{border-color:#e32b43;box-shadow:0 0 18px #e32b431c}
.info small{display:block;color:#aaa;margin-top:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a{background:#1b1517;border:1px solid #48212a;border-radius:9px;padding:9px 11px;font-size:13px}
.actions a:hover{border-color:#ed3048}
.back{display:block;text-align:center;margin-top:28px;padding:13px;border:1px solid #333;border-radius:12px}
footer{text-align:center;color:#777;padding:25px;font-size:12px}
@media(max-width:390px){.card{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style>
</head>
<body>
<header>
<a class="brand" href="/">⚜️ Ziad Ziad Alkfory ⚜️</a>
<button onclick="toggleLang()" id="lang">English</button>
</header>
<main>
<h1 id="title">تواصل <span style="color:#ed3048">معي</span></h1>
<p class="desc" id="desc">اختار الطريقة المناسبة للتواصل</p>

<div class="card">
<div class="info"><strong id="n1">رقم التواصل الأول</strong><small>01031808795</small></div>
<div class="actions">
<a href="https://wa.me/201031808795">WhatsApp</a>
<a href="tel:01031808795" id="call1">اتصال</a>
</div>
</div>

<div class="card">
<div class="info"><strong id="n2">رقم التواصل الثاني</strong><small>01114536964</small></div>
<div class="actions">
<a href="https://wa.me/201114536964">WhatsApp</a>
<a href="tel:01114536964" id="call2">اتصال</a>
</div>
</div>

<div class="card">
<div class="info"><strong id="n3">واتساب إضافي</strong><small>01105683246</small></div>
<div class="actions">
<a href="https://wa.me/201105683246">WhatsApp</a>
</div>
</div>

<a class="back" href="/" id="back">← العودة إلى الصفحة الرئيسية</a>
</main>
<footer>⚜️ 𝒁𝒊𝒂𝒅 𝑨𝒍𝒌𝒇𝒐𝒓𝒚 | المطور ⚜️</footer>
<script>
let en=false;
function toggleLang(){
 en=!en;
 document.documentElement.lang=en?'en':'ar';
 document.documentElement.dir=en?'ltr':'rtl';
 document.getElementById('lang').textContent=en?'العربية':'English';
 document.getElementById('title').innerHTML=en?'Contact <span style="color:#ed3048">Me</span>':'تواصل <span style="color:#ed3048">معي</span>';
 document.getElementById('desc').textContent=en?'Choose your preferred contact method':'اختار الطريقة المناسبة للتواصل';
 document.getElementById('n1').textContent=en?'Contact number 1':'رقم التواصل الأول';
 document.getElementById('n2').textContent=en?'Contact number 2':'رقم التواصل الثاني';
 document.getElementById('n3').textContent=en?'Additional WhatsApp':'واتساب إضافي';
 document.getElementById('call1').textContent=en?'Call':'اتصال';
 document.getElementById('call2').textContent=en?'Call':'اتصال';
 document.getElementById('back').textContent=en?'← Back to homepage':'← العودة إلى الصفحة الرئيسية';
}
</script>
</body>
</html>
